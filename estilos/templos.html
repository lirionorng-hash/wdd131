
<!doctype html>

  <link rel="stylesheet" href="estilos/templos-grandes.css">

  <script src="scripts/templos.js" defer></script>
</head>

<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <header>
    <div class="header-inner">
      <span class="site-title">Álbum do Templo</span>

      <button
        id="menu-button"
        class="menu-button"
        type="button"
        aria-label="Abrir menu"
        aria-expanded="false"
        aria-controls="navigation">
        &#9776;
      </button>

      <nav id="navigation" class="navigation" aria-label="Navegação principal">
        <a href="index.html">Página Inicial</a>
        <a href="#antigo">Antigo</a>
        <a href="#novo">Novo</a>
        <a href="#grande">Grande</a>
        <a href="#pequeno">Pequeno</a>
      </nav>
    </div>
  </header>

  <main id="conteudo">
    <div class="introduction">
      <p class="eyebrow">WDD 131 • Semana 02</p>
      <h1>Álbum de Templos</h1>
      <p>Uma galeria de fotografias que destaca a arquitetura, os jardins e a beleza dos templos.</p>
    </div>

    <div class="gallery">

      <figure id="antigo">
        <img src="imagens/templo-01.jpg"
             alt="Jardim com palmeiras e espelho d'água ao pôr do sol"
             width="640" height="480" loading="lazy">
        <figcaption>Jardim com palmeiras e espelho d'água</figcaption>
      </figure>

      <figure>
        <img src="imagens/templo-02.jpg"
             alt="Templo iluminado sob o céu colorido do entardecer"
             width="640" height="480" loading="lazy">
        <figcaption>Templo ao pôr do sol</figcaption>
      </figure>

      <figure>
        <img src="imagens/templo-03.jpg"
             alt="Fachada de templo com flores vermelhas em primeiro plano"
             width="640" height="480" loading="lazy">
        <figcaption>Templo e jardim florido</figcaption>
      </figure>

      <figure id="novo">
        <img src="imagens/templo-04.jpg"
             alt="Entrada de templo cercada por um jardim de tulipas coloridas"
             width="640" height="480" loading="lazy">
        <figcaption>Fachada com tulipas coloridas</figcaption>
      </figure>

      <figure>
        <img src="imagens/templo-05.jpg"
             alt="Templo com torre central e flores rosas em primeiro plano"
             width="640" height="480" loading="lazy">
        <figcaption>Templo com flores rosas</figcaption>
      </figure>

      <figure>
        <img src="imagens/templo-06.jpg"
             alt="Templo com torre alta e flores coloridas sob o céu do entardecer"
             width="640" height="480" loading="lazy">
        <figcaption>Templo entre jardins e céu colorido</figcaption>
      </figure>

      <figure id="grande">
        <img src="imagens/templo-07.jpg"
             alt="Templo de arquitetura clara com oliveira e canteiros de flores amarelas"
             width="640" height="480" loading="lazy">
        <figcaption>Templo com oliveira e flores amarelas</figcaption>
      </figure>

      <figure id="pequeno">
        <img src="imagens/templo-08.jpg"
             alt="Torre de templo ao fundo de árvores floridas e jardins"
             width="640" height="480" loading="lazy">
        <figcaption>Templo entre árvores floridas</figcaption>
      </figure>

      <figure>
        <img src="imagens/templo-09.jpg"
             alt="Templo claro ao fundo de um caminho de pedras com flores rosas"
             width="640" height="480" loading="lazy">
        <figcaption>Templo com caminho de pedras e flores</figcaption>
      </figure>

    </div>
  </main>

  <footer>
    <p>© <span id="anoatual"></span> • Lirionor Nascimento Guimarães • Paraná, Brasil</p>
    <p id="ultimaModificacao"></p>
  </footer>
</body>
</html>
